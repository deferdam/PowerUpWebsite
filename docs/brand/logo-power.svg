<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Power cap symbol">
  <!-- Cap rim seen from above = power ring (chalk). Knurled grip ribs on the closed part. -->
  <g fill="#EEEBE3">
    <rect x="30" y="10" width="4" height="4" rx="1" transform="rotate(60 32 36)"/>
    <rect x="30" y="10" width="4" height="4" rx="1" transform="rotate(90 32 36)"/>
    <rect x="30" y="10" width="4" height="4" rx="1" transform="rotate(120 32 36)"/>
    <rect x="30" y="10" width="4" height="4" rx="1" transform="rotate(150 32 36)"/>
    <rect x="30" y="10" width="4" height="4" rx="1" transform="rotate(180 32 36)"/>
    <rect x="30" y="10" width="4" height="4" rx="1" transform="rotate(210 32 36)"/>
    <rect x="30" y="10" width="4" height="4" rx="1" transform="rotate(240 32 36)"/>
    <rect x="30" y="10" width="4" height="4" rx="1" transform="rotate(270 32 36)"/>
    <rect x="30" y="10" width="4" height="4" rx="1" transform="rotate(300 32 36)"/>
  </g>
  <path d="M20 20A20 20 0 1 0 44 20" fill="none" stroke="#EEEBE3" stroke-width="6" stroke-linecap="round"/>
  <!-- Power bar = the dose dropping in (volt): bar + falling grains. -->
  <g fill="#D4FF3A">
    <rect x="29" y="3" width="6" height="22" rx="3"/>
    <circle cx="32" cy="33" r="3"/>
    <circle cx="32" cy="41" r="2"/>
  </g>
</svg>
